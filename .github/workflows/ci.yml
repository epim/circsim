name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

# Superseded pushes/PR updates cancel their in-flight run; tag (release) runs
# are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15-intel
          - macos-14
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # ngspice binary acquisition (cached per version)
      # -----------------------------------------------------------------------
      - name: Read ngspice version
        id: ngspice-version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').config?.circsim?.ngspiceVersion ?? '46')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Pinned archive hashes (scripts/ngspice-pins.json) go into the cache keys,
          # so bumping a pin invalidates the cache instead of restoring an unverified build.
          echo "pin-dll=$(node scripts/ngspice-download.mjs --print-sha256 dll | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "pin-src=$(node scripts/ngspice-download.mjs --print-sha256 source | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # ngspice runs on EVERY leg: Windows fetches the prebuilt DLL, macOS/Linux
      # build libngspice from source (same script as the release job). The
      # earlier Windows-only restriction is gone — its two root causes are
      # fixed: the vitest 6 h hang was an AB-BA deadlock between ngspice's bg
      # thread (holding fputsMutex while waiting on a koffi callback relay) and
      # a SYNCHRONOUS ngSpice_Command on the JS main thread (all commands are
      # now issued via koffi's async form, serialized — see ngspiceFfi.ts), and
      # SimHost.dispose() now drains the bg thread before unloading the library
      # so no callback relay is in flight at Node env teardown.
      # Cache-key suffix -r2: earlier source builds shipped a manifest whose
      # cmFiles held only the LAST .cm (env-var bug in build-ngspice.sh) —
      # bumped so runners rebuild with the fixed script.
      # Suffix -r3: libngspice.so used to link libfftw3 (issue #15); the build
      # now passes --with-fftw3=no and gates on its dynamic dependencies, so
      # caches from before that change are dropped.
      - name: Cache ngspice binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        id: cache-ngspice-win
        with:
          path: resources/ngspice/win32-x64
          key: ngspice-win32-x64-v${{ steps.ngspice-version.outputs.version }}-${{ steps.ngspice-version.outputs.pin-dll }}

      - name: Cache ngspice binaries (macOS x64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/cache@v4
        id: cache-ngspice-darwin-x64
        with:
          path: resources/ngspice/darwin-x64
          key: ngspice-darwin-x64-v${{ steps.ngspice-version.outputs.version }}-r3-${{ steps.ngspice-version.outputs.pin-src }}

      - name: Cache ngspice binaries (macOS arm64)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        uses: actions/cache@v4
        id: cache-ngspice-darwin-arm64
        with:
          path: resources/ngspice/darwin-arm64
          key: ngspice-darwin-arm64-v${{ steps.ngspice-version.outputs.version }}-r3-${{ steps.ngspice-version.outputs.pin-src }}

      - name: Cache ngspice binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        id: cache-ngspice-linux
        with:
          path: resources/ngspice/linux-x64
          key: ngspice-linux-x64-v${{ steps.ngspice-version.outputs.version }}-r3-${{ steps.ngspice-version.outputs.pin-src }}

      - name: Install macOS build tools (macOS only)
        if: runner.os == 'macOS' && (steps.cache-ngspice-darwin-x64.outputs.cache-hit != 'true' && steps.cache-ngspice-darwin-arm64.outputs.cache-hit != 'true')
        run: brew install autoconf automake libtool

      - name: Install Linux build tools (Linux only)
        if: runner.os == 'Linux' && steps.cache-ngspice-linux.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake libtool bison flex

      - name: Fetch ngspice DLL (Windows)
        if: runner.os == 'Windows' && steps.cache-ngspice-win.outputs.cache-hit != 'true'
        run: npm run fetch:ngspice

      - name: Build ngspice from source (macOS / Linux)
        if: runner.os != 'Windows' && (steps.cache-ngspice-darwin-x64.outputs.cache-hit != 'true' && steps.cache-ngspice-darwin-arm64.outputs.cache-hit != 'true' && steps.cache-ngspice-linux.outputs.cache-hit != 'true')
        shell: bash
        run: bash scripts/build-ngspice.sh

      # -----------------------------------------------------------------------
      # Build + Test
      # -----------------------------------------------------------------------
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # License-hygiene gate (Task 27, Spec §14): every resources/models/* file
      # carries a Provenance: header; no table.cm in any platform ngspice dir.
      # Fails the build on a violation (also unit-tested in the suite below).
      - name: License hygiene check
        run: npm run license:check

      # npm test already runs every *.integration.test.ts (real ngspice), so
      # there is no separate integration step.
      - name: Test (unit + real-ngspice integration)
        if: runner.os != 'Linux'
        run: npm test

      # Linux leg runs the same suite with v8 coverage and uploads the report.
      - name: Test with coverage (unit + real-ngspice integration)
        if: runner.os == 'Linux'
        run: npm run coverage

      - name: Upload coverage report
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      # A known-bug marker (an it.fails, a KNOWN_BUG_<n>_OPEN flag, a knownFailing
      # row) must be flipped in the PR that closes its issue. This fails when a
      # marker references a closed issue. It reads issue state through gh with the
      # workflow token; it skips with a message when no credentials are available.
      - name: Check stale known-bug markers
        if: runner.os == 'Linux'
        run: npm run check:markers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Real-board corpus: KiCad-written boards fetched at test time against the
      # hashes in scripts/corpus-manifest.json (never committed). The cache key is
      # the manifest, so a corpus change refetches and nothing else does. No
      # kicad-cli on these legs: pad-to-net checks use test/corpus/oracle.json.
      - name: Cache corpus boards
        uses: actions/cache@v4
        with:
          path: .corpus-cache
          key: corpus-${{ hashFiles('scripts/corpus-manifest.json') }}

      - name: Corpus suite
        run: npm run test:corpus

      - name: Upload corpus metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-metrics-${{ matrix.os }}
          path: test-results/corpus/metrics.json
          if-no-files-found: ignore

      - name: Model characterization (datasheet values, real ngspice)
        run: npm run test:characterization

      # Packaged launch smoke (macOS): package the host-arch .app with
      # electron-builder --dir and launch it through Playwright, asserting the
      # bundled libngspice loads and a real op solve completes (packaged-smoke
      # spec). Before this, no step launched a packaged mac build at all.
      # CIRCSIM_REQUIRE_PACKAGED=1 makes a missing .app a failure, not a skip.
      - name: Package unpacked app (macOS, for packaged-smoke spec)
        if: runner.os == 'macOS'
        run: |
          npm run build
          npx electron-builder --dir

      - name: Packaged app launch smoke (macOS)
        if: runner.os == 'macOS'
        run: npx playwright test --config playwright.config.ts e2e/packaged-smoke.spec.ts
        env:
          CIRCSIM_REQUIRE_PACKAGED: '1'

      # The smoke spec prints renderer state and console on failure; the
      # screenshot and error context land in test-results/. Without this the
      # Test job kept nothing, so a red packaged launch could not be diagnosed.
      - name: Upload packaged smoke diagnostics (macOS, on failure)
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # KiCad load job: every fixture and bundled sample must load in a real KiCad
  # (issue #24). The fixtures use board format version 20260206, which KiCad 9
  # cannot read, so this installs KiCad 10 from the KiCad PPA (Ubuntu 24.04).
  # CIRCSIM_REQUIRE_KICAD_CLI=1 turns a missing kicad-cli into a failure, so the
  # gate cannot silently skip. No ngspice is needed.
  # ===========================================================================
  kicad-load:
    name: KiCad 10 load
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version

      - name: Fixtures and samples load in kicad-cli
        run: npx vitest run --reporter=verbose src/core/__tests__/kicadCliLoad.test.ts
        env:
          CIRCSIM_REQUIRE_KICAD_CLI: '1'

  # ===========================================================================
  # E2E job — Playwright drives the BUILT app (out/) via _electron.launch with
  # real ngspice underneath (same binary caches as the test job).
  #
  # Legs:
  #   windows-latest → smoke + first-light + packaged-smoke (electron-builder
  #                    --dir provides dist/win-unpacked so the packaged spec
  #                    exercises the installer-critical resource paths:
  #                    asar-external ngspice.dll + .cm, bundled sample/models)
  #   ubuntu-latest  → smoke + first-light under xvfb (packaged spec self-skips;
  #                    it is Windows-only by path). The Chromium SUID sandbox is
  #                    unavailable on GitHub's ubuntu-24.04 runners (AppArmor
  #                    restricts unprivileged user namespaces), so the run sets
  #                    ELECTRON_DISABLE_SANDBOX=1.
  #
  # Runs in parallel with `test`; the release job gates on BOTH.
  # ===========================================================================
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read ngspice version
        id: ngspice-version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').config?.circsim?.ngspiceVersion ?? '46')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Pinned archive hashes (scripts/ngspice-pins.json) go into the cache keys,
          # so bumping a pin invalidates the cache instead of restoring an unverified build.
          echo "pin-dll=$(node scripts/ngspice-download.mjs --print-sha256 dll | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "pin-src=$(node scripts/ngspice-download.mjs --print-sha256 source | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # Same cache keys as the test/release jobs, so this job normally restores
      # a prebuilt ngspice and never compiles.
      - name: Cache ngspice binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        id: cache-ngspice-win
        with:
          path: resources/ngspice/win32-x64
          key: ngspice-win32-x64-v${{ steps.ngspice-version.outputs.version }}-${{ steps.ngspice-version.outputs.pin-dll }}

      - name: Cache ngspice binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        id: cache-ngspice-linux
        with:
          path: resources/ngspice/linux-x64
          key: ngspice-linux-x64-v${{ steps.ngspice-version.outputs.version }}-r3-${{ steps.ngspice-version.outputs.pin-src }}

      - name: Fetch ngspice DLL (Windows)
        if: runner.os == 'Windows' && steps.cache-ngspice-win.outputs.cache-hit != 'true'
        run: npm run fetch:ngspice

      - name: Install Linux build tools (Linux, cache miss only)
        if: runner.os == 'Linux' && steps.cache-ngspice-linux.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake libtool bison flex

      - name: Build ngspice from source (Linux, cache miss only)
        if: runner.os == 'Linux' && steps.cache-ngspice-linux.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build-ngspice.sh

      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run > /dev/null || (sudo apt-get update -q && sudo apt-get install -y xvfb)

      - name: Build app bundles
        run: npm run build

      # Windows and Linux both package an unpacked app so the packaged-smoke
      # spec launches it (dist/win-unpacked, dist/linux-unpacked). On Linux this
      # is the check that would have caught issue #15: the packaged libngspice.so
      # must dlopen on the runner with only the declared libraries around.
      - name: Package unpacked app (Windows and Linux, for packaged-smoke spec)
        run: npx electron-builder --dir

      # OMP_*: the Windows ngspice DLL links OpenMP (libomp140); on shared
      # 4-vCPU runners its default spin-waiting worker threads starve the
      # solver thread and stretch op solves past every timeout. One passive
      # thread makes the tiny demo boards solve fastest anyway.
      - name: Run Playwright E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
        env:
          CIRCSIM_REQUIRE_PACKAGED: '1'
          OMP_NUM_THREADS: '1'
          OMP_WAIT_POLICY: 'PASSIVE'

      - name: Run Playwright E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- npm run test:e2e
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          CIRCSIM_REQUIRE_PACKAGED: '1'
          OMP_NUM_THREADS: '1'
          OMP_WAIT_POLICY: 'PASSIVE'

      - name: Upload Playwright report + screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # ===========================================================================
  # Release job (Task 27, Spec §15) — tag-triggered only.
  #
  # Builds the installer matrix and attaches the artifacts to the GitHub release
  # for the pushed tag. Each runner fetches/builds ONLY its own ngspice, then
  # electron-builder bundles that platform's binaries (per electron-builder.yml's
  # per-platform extraResources). Builds are UNSIGNED for v1 (signing is the one
  # documented deferral — see docs/licensing.md).
  #
  # Matrix:
  #   windows-latest   → NSIS .exe (x64)
  #   macos-15-intel   → .dmg (x64)
  #   macos-14         → .dmg (arm64)
  #   ubuntu-latest    → AppImage + .deb (x64)
  # ===========================================================================
  release:
    name: Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, e2e]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write # attach artifacts to the GitHub release
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15-intel
          - macos-14
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read ngspice version
        id: ngspice-version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').config?.circsim?.ngspiceVersion ?? '46')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Pinned archive hashes (scripts/ngspice-pins.json) go into the cache keys,
          # so bumping a pin invalidates the cache instead of restoring an unverified build.
          echo "pin-dll=$(node scripts/ngspice-download.mjs --print-sha256 dll | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "pin-src=$(node scripts/ngspice-download.mjs --print-sha256 source | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # ngspice cache (same keys as the test job, so a release reuses the cache).
      - name: Cache ngspice binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        id: cache-ngspice-win
        with:
          path: resources/ngspice/win32-x64
          key: ngspice-win32-x64-v${{ steps.ngspice-version.outputs.version }}-${{ steps.ngspice-version.outputs.pin-dll }}

      - name: Cache ngspice binaries (macOS x64)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/cache@v4
        id: cache-ngspice-darwin-x64
        with:
          path: resources/ngspice/darwin-x64
          key: ngspice-darwin-x64-v${{ steps.ngspice-version.outputs.version }}-r3-${{ steps.ngspice-version.outputs.pin-src }}

      - name: Cache ngspice binaries (macOS arm64)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        uses: actions/cache@v4
        id: cache-ngspice-darwin-arm64
        with:
          path: resources/ngspice/darwin-arm64
          key: ngspice-darwin-arm64-v${{ steps.ngspice-version.outputs.version }}-r3-${{ steps.ngspice-version.outputs.pin-src }}

      - name: Cache ngspice binaries (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        id: cache-ngspice-linux
        with:
          path: resources/ngspice/linux-x64
          key: ngspice-linux-x64-v${{ steps.ngspice-version.outputs.version }}-r3-${{ steps.ngspice-version.outputs.pin-src }}

      - name: Install macOS build tools (macOS only)
        if: runner.os == 'macOS' && (steps.cache-ngspice-darwin-x64.outputs.cache-hit != 'true' && steps.cache-ngspice-darwin-arm64.outputs.cache-hit != 'true')
        run: brew install autoconf automake libtool

      - name: Install Linux build tools (Linux only)
        if: runner.os == 'Linux' && steps.cache-ngspice-linux.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake libtool bison flex

      - name: Fetch ngspice DLL (Windows)
        if: runner.os == 'Windows' && steps.cache-ngspice-win.outputs.cache-hit != 'true'
        run: npm run fetch:ngspice

      - name: Build ngspice from source (macOS / Linux)
        if: runner.os != 'Windows' && (steps.cache-ngspice-darwin-x64.outputs.cache-hit != 'true' && steps.cache-ngspice-darwin-arm64.outputs.cache-hit != 'true' && steps.cache-ngspice-linux.outputs.cache-hit != 'true')
        shell: bash
        run: bash scripts/build-ngspice.sh

      # Guard: never package a non-compliant bundle.
      - name: License hygiene check
        run: npm run license:check

      # Build the app bundles (main/preload/renderer/simhost) then the installer.
      - name: Build app bundles
        run: npm run build

      - name: Package installers (electron-builder)
        # GH_TOKEN lets electron-builder publish artifacts to the release when
        # invoked with --publish; we publish explicitly below via softprops to
        # keep the matrix outputs in one release. Here we only build (--publish never).
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Guard against the cross-arch dmg regression: electron-builder.yml must
      # build HOST arch only (no mac arch list), because each runner has ngspice
      # for its own arch alone. When both arches were listed, every mac runner
      # also produced the other arch's dmg with the wrong ngspice inside, and
      # the last release leg to attach overwrote both dmgs — shipping one mac
      # installer per release whose simulator could not load. Fail loudly if
      # the packaged app is missing host-arch ngspice or a stray second dmg
      # appears.
      - name: Verify mac app bundles host-arch ngspice
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) WANT="darwin-x64" ;;
            arm64)  WANT="darwin-arm64" ;;
            *) echo "::error::unexpected mac arch: $ARCH"; exit 1 ;;
          esac
          DMG_COUNT="$(ls dist/*.dmg | wc -l | tr -d ' ')"
          if [ "$DMG_COUNT" != "1" ]; then
            echo "::error::expected exactly 1 dmg (host arch), found $DMG_COUNT — cross-arch build is back?"
            ls -l dist/*.dmg
            exit 1
          fi
          APP="$(ls -d dist/mac*/circsim.app | head -1)"
          if [ ! -d "$APP/Contents/Resources/ngspice/$WANT" ]; then
            echo "::error::packaged app is missing Resources/ngspice/$WANT"
            ls "$APP/Contents/Resources/ngspice" || true
            exit 1
          fi
          echo "ok: $APP bundles ngspice/$WANT and exactly one dmg was built"

      # Issue #15 guard on the REAL .deb: install it into a bare Debian image
      # with only its declared Depends (apt resolves those, nothing else) and
      # require every shared library of the bundled libngspice to resolve. A
      # regression that links a library the deb does not declare (as libfftw3
      # once did) fails here, before the installer is attached to the release.
      - name: Verify deb libngspice loads with only declared Depends (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DEB="$(ls dist/*.deb | head -1)"
          docker run --rm -e DEB_NAME="$(basename "$DEB")" -v "$PWD/dist:/dist:ro" debian:bookworm-slim bash -euxc '
            apt-get update -q
            apt-get install -y --no-install-recommends "/dist/${DEB_NAME}"
            LIB=/opt/circsim/resources/ngspice/linux-x64/libngspice.so
            test -f "$LIB"
            OUT="$(ldd "$LIB")"
            echo "$OUT"
            if echo "$OUT" | grep -q "not found"; then
              echo "::error::libngspice.so has unresolved libraries with only the deb Depends installed"
              exit 1
            fi
          '

      - name: Upload build artifacts (CI retention)
        uses: actions/upload-artifact@v4
        with:
          name: circsim-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

      - name: Attach installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          draft: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
